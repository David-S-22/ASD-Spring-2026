<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tally — Bills &amp; subscriptions</title>
<!-- htmx stays in the head deliberately. The shared shell swaps this whole
     document into #content with hx-swap="innerHTML", and htmx drops the head
     when it parses a full document, so this tag is skipped there -- which is
     what we want: inside the shell htmx is already loaded and shared, and a
     second copy would overwrite it for every other feature's tab. Standalone
     on :3005 the head is honoured and this is the only htmx on the page. -->
<script src="/bills-frontend/js/htmx-2.0.4.min.js"></script>
</head>
<body>
<!-- The stylesheets sit in the body for the opposite reason: they are dropped
     with the head inside the shell, and unlike htmx nothing there replaces
     them. The shell's own theme.css defines a completely different set of
     custom properties (--color-bg, --color-text) from the ones this feature
     consumes (--bg, --ink, --mut), so without these two links every var() in
     bills.css resolves to nothing. Body-level <link> is applied on insertion
     in every browser we target, and survives the fragment swap. -->
<link rel="stylesheet" href="/bills-frontend/css/theme.css">
<link rel="stylesheet" href="/bills-frontend/css/bills.css">
<div id="bills-root">
  <!-- One page, no inner tabs: the table, then Disputes, then Ask Tally.
       Calendar and Coming up are deliberately absent (low priority) — their
       /ui/calendar and /ui/timeline routes still exist for direct use. -->
  <!-- Wide screens: two tracks — the work (table, then Disputes) on the left,
       Ask Tally + Suggestions as a sticky sidebar on the right, so the chat
       loop is visible while the table it changes is on screen. Narrow
       screens stack back to the single column: table → Disputes → chat. -->
  <div class="bills-page">
    <div class="main-column">
      <div class="table-section">
        <!-- Outside #bills-table on purpose. That div is a fragment root and is
             replaced wholesale by every write path, and anything inside it loses
             its value and focus on every write — which for a search box people
             are typing into is not a detail. app.js re-applies the filter on
             htmx:afterSwap. -->
        <label class="bills-search">
          <span class="visually-hidden">Search bills</span>
          <input type="search" id="bills-search" placeholder="Search bills…" autocomplete="off">
        </label>
        <div id="bills-table" class="card" hx-get="/bills-backend/ui/bills" hx-trigger="load" hx-swap="outerHTML"></div>
      </div>
      <section class="disputes-section card" id="disputes-section" aria-label="Disputes">
        <h3>Disputes</h3>
        <div id="disputes-tab" hx-get="/bills-backend/ui/disputes-tab" hx-trigger="load"></div>
      </section>
    </div>
    <aside class="side-column">
      <div class="ask-tally card">
        <h3>Ask Tally</h3>
        <div id="chat-panel" hx-get="/bills-backend/ui/chat" hx-trigger="load"></div>
        <!-- The approve/reject window. Everything the AI proposes lands here as
             a pending suggestion; nothing is written until it is approved.
             Fragment root replaces this div (outerHTML) and carries the same id,
             so approve/reject responses and the chat's OOB refresh all have one
             target. -->
        <div id="suggestions-panel" hx-get="/bills-backend/ui/suggestions" hx-trigger="load" hx-swap="outerHTML"></div>
      </div>
    </aside>
  </div>
  <div id="modal-root"></div>
  <div class="toast-holder" id="toast-root"></div>
</div>
<script src="/bills-frontend/js/app.js"></script>
</body>
</html>
