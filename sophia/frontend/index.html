<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tally — Bills &amp; subscriptions</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/bills.css">
<script src="/js/htmx-2.0.4.min.js"></script>
</head>
<body>
<div class="app-shell">
  <div class="tab-panel">
    <div class="tabs">
      <button type="button" class="active" data-tab="bills">Bills</button>
      <button type="button" data-tab="calendar">Calendar</button>
      <button type="button" data-tab="timeline">Coming up</button>
      <button type="button" data-tab="disputes">Disputes</button>
    </div>
    <div class="tab-page active" data-tab-page="bills">
      <div id="bills-table" class="card" hx-get="/ui/bills" hx-trigger="load" hx-swap="outerHTML"></div>
    </div>
    <div class="tab-page" data-tab-page="calendar">
      <div id="calendar-card" class="card" hx-get="/ui/calendar" hx-trigger="load" hx-swap="outerHTML"></div>
    </div>
    <div class="tab-page" data-tab-page="timeline">
      <div id="timeline" class="card" hx-get="/ui/timeline" hx-trigger="load" hx-swap="outerHTML"></div>
    </div>
    <div class="tab-page" data-tab-page="disputes">
      <div id="disputes-tab" class="card" hx-get="/ui/disputes-tab" hx-trigger="load"></div>
    </div>
  </div>
  <div class="ask-tally card">
    <h3>Ask Tally</h3>
    <div id="chat-panel" hx-get="/ui/chat" hx-trigger="load"></div>
  </div>
</div>
<div id="modal-root"></div>
<div class="toast-holder" id="toast-root"></div>
<script src="/js/app.js"></script>
</body>
</html>
