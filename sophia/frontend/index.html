<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tally — Bills &amp; subscriptions</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/bills.css">
<script src="js/htmx-2.0.4.min.js"></script>
</head>
<body>
<div class="app-shell">
  <div class="tab-panel">
    <div class="tabs">
      <button type="button" class="active" data-tab="bills" hx-get="/ui/bills" hx-target="#tab-content">Bills</button>
      <button type="button" data-tab="calendar" hx-get="/ui/calendar" hx-target="#tab-content">Calendar</button>
      <button type="button" data-tab="timeline" hx-get="/ui/timeline" hx-target="#tab-content">Coming up</button>
      <button type="button" data-tab="disputes" hx-get="/ui/disputes" hx-target="#tab-content">Disputes</button>
    </div>
    <div id="tab-content" class="card" hx-get="/ui/bills" hx-trigger="load"></div>
  </div>
  <div class="ask-tally card">
    <h3>Ask Tally</h3>
    <div id="chat-panel" hx-get="/ui/chat" hx-trigger="load"></div>
  </div>
</div>
<div id="modal-root"></div>
<div class="toast-holder" id="toast-root"></div>
<script src="js/app.js"></script>
</body>
</html>
