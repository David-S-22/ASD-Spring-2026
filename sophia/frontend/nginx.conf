server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://bills-backend:5005;
        proxy_set_header Host $host;
    }

    location /ui/ {
        proxy_pass http://bills-backend:5005;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
