{# Ask Tally chat panel fragment: chips, history with preview cards, input. #}
<div class="chat-panel">
  <div class="chips">
    <button data-chip="What do my bills add up to?">What do my bills add up to?</button>
    <button data-chip="Which subscriptions am I barely using?">Which subscriptions am I barely using?</button>
    <button data-chip="I cancelled Spotify from September — remove the future payments">I cancelled Spotify from September — remove the future payments</button>
    <button data-chip="Draft a note to dispute my GymCo charge">Draft a note to dispute my GymCo charge</button>
  </div>
  <div class="history">
    {% for message in messages %}
    {% if message.heading %}<h4 class="history-heading">{{ message.heading }}</h4>{% endif %}
    <div class="message message-{{ message.role }}">{{ message.content }}</div>
    {% if message.preview %}
    <div class="preview-card">
      <button class="confirm" hx-post="/api/chat/apply" hx-vals='{{ message.preview | tojson }}'>Confirm</button>
      <button class="keep-it" data-action="dismiss-preview">Keep it</button>
    </div>
    {% endif %}
    {% endfor %}
  </div>
  <form hx-post="/api/chat" hx-target=".history" hx-swap="beforeend">
    <input name="message" placeholder="Ask" />
  </form>
</div>
