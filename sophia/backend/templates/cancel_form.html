{# Cancel-bill modal form: sets end_date, defaulting to the bill's next occurrence. #}
<div class="modal-form" id="cancel-form">
  <h3>Cancel {{ bill.name }}</h3>
  <p>Last payment lands on {{ bill.next_occurrence }}.</p>
  <form hx-post="/bills-backend/ui/bills/{{ bill.id }}/cancel" hx-target="#bills-table" hx-swap="outerHTML">
    <label>End date
      <input name="end_date" type="date" value="{{ bill.next_occurrence }}" required>
    </label>
    <div class="form-actions">
      <button type="submit">Cancel this bill</button>
      <button type="button" data-action="dismiss-modal">Keep it</button>
    </div>
  </form>
</div>
