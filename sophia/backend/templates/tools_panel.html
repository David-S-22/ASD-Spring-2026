{# Tools card: one bill picker, one button per allow-listed MCP tool the card exposes; every result lands in #tool-result. Root id is a fragment contract. #}
<div class="tools-panel card" id="tools-panel">
  <h3>Tools <span class="mode-badge mode-{{ 'on' if enabled else 'off' }}">MCP {{ 'enabled' if enabled else 'disabled' }}</span></h3>
  <form hx-post="/bills-backend/ui/tools/search_transactions" hx-target="#tool-result" hx-swap="innerHTML" hx-disabled-elt="find button" hx-indicator="find .working">
    <label>Bill
      <select name="bill_id">
        {% for bill in bills %}<option value="{{ bill.id }}">{{ bill.name }} ({{ bill.merchant }})</option>{% endfor %}
      </select>
    </label>
    <button type="submit" class="btn-sm">Match transactions</button>
    <button type="button" class="btn-sm" hx-post="/bills-backend/ui/tools/get_bill_payments" hx-include="closest form" hx-target="#tool-result" hx-swap="innerHTML">Payment history</button>
    <button type="button" class="btn-sm" hx-post="/bills-backend/ui/tools/compare_bill_with_bank_charges" hx-include="closest form" hx-target="#tool-result" hx-swap="innerHTML">Compare with bank</button>
    <span class="working" aria-live="polite">Calling the MCP server…</span>
  </form>
  <div id="tool-result"></div>
</div>
