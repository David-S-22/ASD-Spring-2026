# Generated paraphrases for the Ask Tally corpus, same schema as chat_queries.yaml. Route is the one the norms require.
- message: "whats the total of all my bills per month"
  route: total
- message: "pls add up everything i pay each month (bills + subs)"
  route: total
- message: "how much do my bils come to altogether monthly?"
  route: total
- message: "total for rent and electricity together each month"
  route: total
  expect: {contains: ["Rent", "Electricity"], not: ["all bills"]}
- message: "Please give me my overall monthly spend"
  route: total
- message: "what do netflix and spotify cost me combined per month"
  route: total
  expect: {contains: ["Netflix", "Spotify"], not: ["all bills"]}
- message: "whats due this week"
  route: upcoming
  expect: {contains: ["this week"]}
- message: "please list what i need to pay in the next 10 days"
  route: upcoming
  expect: {contains: ["next 10 days"]}
- message: "anything due next fortnight (including subs)?"
  route: upcoming
  expect: {contains: ["next 14 days"]}
- message: "what bils are due over the next month"
  route: upcoming
  expect: {contains: ["next 30 days"]}
- message: "when do i have to pay netflix and gymco this month"
  route: upcoming
  expect: {contains: ["Netflix on", "GymCo on"], not: ["Rent"]}
- message: "what will i pay in the next week"
  route: upcoming
  expect: {contains: ["this week"]}
- message: "which subs am i not really using"
  route: barely_using
- message: "please show me the subscriptions i barely use?"
  route: barely_using
- message: "is spotify one i hardly ever use (be honest)"
  route: barely_using
- message: "which subscriptoins do i never use"
  route: barely_using
- message: "are netflix and disney+ ones i barely touch"
  route: barely_using
- message: "which of my bills am i barely using"
  route: barely_using
- message: "has netflix charged me this month"
  route: tool
- message: "please check what gymco has taken from me"
  route: tool
- message: "did spotify actualy charge me (the last one)"
  route: tool
- message: "was i charged by electricity and rent recently?"
  route: tool
- message: "what has disney+ debited so far"
  route: grounded
  expect: {insufficient: true}
- message: "show me what netflix actually charged me"
  route: tool
- message: "when is my home internet due"
  route: grounded
- message: "how do i pay my electricity bill"
  route: grounded
- message: "why is my gymco bill overdue?"
  route: grounded
- message: "whats my car insurance cost per month (not sure it's tracked)"
  route: grounded
  expect: {insufficient: true}
- message: "how much is my phone plan"
  route: grounded
  expect: {insufficient: false}
- message: "when is netflix next charged and how do i pay it"
  route: grounded
- message: "change spotify to $12.99 a month"
  route: proposal
  expect: {title: "Update Spotify"}
- message: "pls cancel netflix from november"
  route: proposal
  expect: {title: "Update Netflix"}
- message: "add disney+ for 11.99 monthly starting 3 november (paid by card)"
  route: proposal
  expect: {title: "Add bill: Disney+"}
- message: "dispute my electrcity charge, i was billed twice"
  route: proposal
  expect: {title: "Open dispute for Electricity"}
- message: "i want to dispute the netflix charge please"
  route: proposal
  expect: {title: "Open dispute for Netflix"}
- message: "can you draft a dispute for my spotify charge?"
  route: proposal
  expect: {title: "Open dispute for Spotify"}
- message: "add a subscription"
  route: ask_back
  expect: {contains: ["I just need"]}
- message: "change my spotify"
  route: ask_back
- message: "pls add disney+"
  route: ask_back
- message: "update my netflix bill (not sure what to put)"
  route: ask_back
- message: "cancel my gymco"
  route: ask_back
- message: "add a new bill for electricity and a gym membership"
  route: ask_back
