<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Savings Advisor</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" 
      integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" 
      crossorigin="anonymous">
    </script>
  </head>
  <body>
    <h1>Savings Advisor</h1>

    <section>
      <h2>Suggestions</h2>
      <button type="button"
              hx-post="/savings/suggestion"
              hx-target="#suggestions"
              hx-swap="innerHTML">
          Create dummy suggestion
      </button>
      <table>
          <thead>
              <tr>
                  <th>ID</th>
                  <th>Suggestion</th>
                  <th>Accepted</th>
              </tr>
          </thead>
          <tbody id="suggestions" hx-get="/savings/suggestions" hx-trigger="load" hx-swap="innerHTML">
              <tr><td colspan="3">Loading suggestions…</td></tr>
          </tbody>
      </table>
    </section>
  </body>
</html>
