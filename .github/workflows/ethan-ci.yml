name: ethan-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ethan-ci.yml
      - ethan/**
      - docker-compose.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/ethan-ci.yml
      - ethan/**
      - docker-compose.yml

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ethan
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt -r database/requirements.txt -r test/requirements.txt
      - run: pytest

  build-health:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - run: docker compose build ethan-frontend ethan-backend ethan-db
      - run: docker compose up -d ethan-frontend ethan-backend ethan-db
      - run: sleep 3
      - name: Check frontend availability
        run: curl --fail http://127.0.0.1:3006/ || exit 1
      - name: Check backend availability
        run: curl --fail http://127.0.0.1:5006/ || exit 1
      - name: Check database availability
        run: curl --fail http://127.0.0.1:6006/ || exit 1
      - run: docker compose logs ethan-frontend ethan-backend ethan-db
        if: failure()
      - run: docker compose rm --stop --force --volumes ethan-frontend ethan-backend ethan-db
        if: always()
