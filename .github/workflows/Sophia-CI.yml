name: Sophia-CI

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "sophia/**"
      - ".github/workflows/Sophia-CI.yml"
  push:
    branches:
      - "main"
    paths:
      - "sophia/**"
      - ".github/workflows/Sophia-CI.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r sophia/requirements.txt
      - name: Run tests
        run: pytest sophia/test -q --cov=sophia/backend/engine --cov-report=term
