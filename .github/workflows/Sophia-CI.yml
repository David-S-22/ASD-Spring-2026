name: Sophia-CI

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "sophia/**"
      - ".github/workflows/Sophia-CI.yml"
      - "shared/**"
  push:
    branches:
      - "main"
    paths:
      - "sophia/**"
      - ".github/workflows/Sophia-CI.yml"
      - "shared/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r sophia/requirements.txt
      - name: Run tests
        run: python -m pytest sophia/test -q --cov=sophia/backend --cov-report=term

  docker-health:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build service images
        run: docker compose build bills-frontend bills-backend bills-db
      - name: Start services
        run: docker compose up -d bills-db bills-backend bills-frontend
      - run: sleep 5
      - name: Check database health
        run: curl --fail http://127.0.0.1:6005/health
      - name: Check backend health
        run: curl --fail http://127.0.0.1:5005/health
      - name: Check frontend availability
        run: curl --fail -o /dev/null http://127.0.0.1:3005/
      - name: Dump container logs
        run: docker compose logs bills-db bills-backend bills-frontend
        if: failure()
      - name: Tear down
        run: docker compose down -v
        if: always()
