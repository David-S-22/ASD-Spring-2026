name: Sophia-CI

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "sophia/**"
      - ".github/workflows/Sophia-CI.yml"
      - "shared/**"
  push:
    branches:
      - "main"
    paths:
      - "sophia/**"
      - ".github/workflows/Sophia-CI.yml"
      - "shared/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r sophia/requirements.txt
      - name: Run tests
        run: python -m pytest sophia/test -q --cov=sophia/backend --cov-report=term

  docker-health: # Check bills container health after startup
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - run: docker compose build bills-frontend bills-backend bills-db
      - run: docker compose up -d bills-db bills-backend bills-frontend
      - run: sleep 5
      - name: Check database availability
        run: curl --fail http://127.0.0.1:6005/health || exit 1
      - name: Check backend availability
        run: curl --fail --silent http://127.0.0.1:5005/health | grep '"ok":true' || exit 1
      - name: Check frontend availability
        run: curl --fail http://127.0.0.1:3005/ || exit 1
      - run: docker logs bills-db && docker logs bills-backend && docker logs bills-frontend
        if: failure()
      - run: docker compose down -v
        if: always()
