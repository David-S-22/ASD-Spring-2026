name: David-CI

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "david/**"
      - ".github/workflows/David-CI.yml"
      - "docker-compose.yml"
      - "shared/**"
  push:
    branches:
      - "main"
    paths:
      - "david/**"
      - ".github/workflows/David-CI.yml"
      - "docker-compose.yml"
      - "shared/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r david/database/requirements.txt
          pip install -r david/test/requirements.txt
      - name: Run tests
        run: |
          pip install pytest pytest-cov
          pytest david/

  build-health:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v6
      - run: docker compose build savings-frontend savings-backend savings-db
      - run: docker compose up --no-deps --detach savings-frontend savings-backend savings-db
      - name: Check frontend availability
        run: |
          for i in $(seq 1 8); do
            curl --fail http://127.0.0.1:3002/ && exit 0
            sleep 2
          done
          exit 1
      - name: Check backend availability
        run: |
          for i in $(seq 1 8); do
            curl --fail http://127.0.0.1:5002/ && exit 0
            sleep 2
          done
          exit 1
      - name: Check database availability
        run: |
          for i in $(seq 1 8); do
            curl --fail http://127.0.0.1:6002/ && exit 0
            sleep 2
          done
          exit 1
      - run: docker logs savings-frontend savings-backend savings-db
        if: always()
      - run: docker compose down -v
