name: David-CI

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
    paths:
      - "david/**"
jobs:
  build:
    name: David-CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pip install pytest pytest-cov
          pytest david/
