name: aiden-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/actions/aiden-ci.yml
      - aiden/**

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiden
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - run: pip install -r database/requirements.txt -r test/requirements.txt
      - run: pytest
