name: aiden-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/aiden-ci.yml
      - aiden/**

jobs:
  pytest: # Run unit test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiden
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - run: pip install -r backend/requirements.txt -r database/requirements.txt -r test/requirements.txt
      - run: pytest

  docker-health: # Check docker container health after startup
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose build anomalies-backend anomalies-db
      - run: docker compose up -d anomalies-backend anomalies-db
      - run: sleep 3
      - run: curl --fail http://127.0.0.1:5004/ || exit 1
      - run: curl --fail http://127.0.0.1:6004/ || exit 1
      - run: docker logs anomalies-backend anomalies-db
        if: failure()
      - run: docker rm --force --volumes anomalies-backend anomalies-db
        if: always()
