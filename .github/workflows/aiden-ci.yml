name: aiden-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/aiden-ci.yml
      - aiden/**

jobs:
  pytest: # Run unit test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiden
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - run: pip install -r database/requirements.txt -r test/requirements.txt
      - run: pytest

  database: # Check database container startup
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v6
      - run: docker-compose up anomalies-db --build
      - run: sleep 5
      - run: curl --fail http://127.0.0.1:6004/ || exit 1
      - run: docker logs anomalies-db
        if: failure()
      - run: docker rm -f anomalies-db
        if: always()
