name: Janelle-CI

on:
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/janelle-ci.yml"
      - "docker-compose.yml"
      - "janelle/**"
      - "shared/**"
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/janelle-ci.yml"
      - "docker-compose.yml"
      - "janelle/**"
      - "shared/**"

permissions:
  contents: read

jobs:
  build-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build transaction service images
        run: docker compose build transactions-frontend transactions-backend transactions-db
      - name: Start transaction services
        run: docker compose up --detach transactions-frontend transactions-backend transactions-db
      - name: Check service availability
        shell: bash
        run: |
          set -euo pipefail

          check_endpoint() {
            local service="$1"
            local url="$2"

            for _ in {1..30}; do
              if curl --connect-timeout 1 --max-time 2 --fail --silent "$url" > /dev/null; then
                return 0
              fi
              sleep 1
            done

            echo "::error::$service did not become available at $url"
            curl --connect-timeout 2 --max-time 5 --fail --show-error "$url"
          }

          check_endpoint "transactions frontend" "http://127.0.0.1:3001/"
          check_endpoint "transactions backend" "http://127.0.0.1:5001/"
          check_endpoint "transactions database" "http://127.0.0.1:6001/"
      - name: Show container logs
        if: failure()
        run: docker compose logs transactions-frontend transactions-backend transactions-db
      - name: Stop transaction services
        if: always()
        run: docker compose down --volumes --remove-orphans
