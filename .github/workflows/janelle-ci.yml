name: Janelle-CI

on:
  pull_request:
    branches:
      - "main"
    paths:
      - .github/workflows/janelle-ci.yml
      - docker-compose.yml
      - janelle/**
      - shared/**
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/janelle-ci.yml"
      - "docker-compose.yml"
      - "janelle/**"
      - "shared/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: Install test dependencies
        run: pip install -r janelle/backend/requirements.txt -r janelle/database/requirements.txt -r janelle/test/requirements.txt
      - name: Run tests
        run: python -m pytest janelle/test -q

  build-health: # Check docker container health after startup
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - run: docker compose up --no-deps --detach transactions-frontend transactions-backend transactions-db
        env:
          MCP_ENABLED: "false"
          RAG_ENABLED: "false"
      - run: sleep 3
      - name: Check frontend availability
        run: curl --fail http://127.0.0.1:3001/health || exit 1
      - name: Check backend availability and disabled modes
        run: |
          body=$(curl --fail --silent http://127.0.0.1:5001/health) || exit 1
          echo "$body"
          echo "$body" | grep -q '"mcp":"disabled"' || exit 1
          echo "$body" | grep -q '"rag":"disabled"' || exit 1
      - name: Check MCP diagnostics refuse when disabled
        run: test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5001/mcp/tools)" = "503"
      - name: Check database availability
        run: curl --fail http://127.0.0.1:6001/ || exit 1
      - run: docker logs transactions-frontend transactions-backend transactions-db
        if: failure()
      - run: docker rm --force --volumes transactions-frontend transactions-backend transactions-db
        if: always()
