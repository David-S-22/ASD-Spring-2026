<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anomalies</title>
</head>
<body>
    <h1>Anomalies</h1>
    <button type="button"
            hx-post="/anomalies-backend/dummy-anomaly"
            hx-target="#anomalies"
            hx-swap="innerHTML">
        Create dummy anomaly
    </button>
    <button type="button" onclick="checkDummyTransaction()">
        Check dummy transaction
    </button>
    <div id="alert"></div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Transaction</th>
                <th>Reason suspected</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="anomalies" hx-get="/anomalies-backend/anomalies" hx-trigger="load, every 5s" hx-swap="innerHTML">
            <tr><td colspan="4" style="text-align: center;">Loading…</td></tr>
        </tbody>
    </table>

    <script>
        // Provides a dummy transaction payload for the anomaly checker.
        window.dummyTransaction = function () {
            const merchants = ["Corner Store", "MegaMart", "Unknown LLC", "Cafe 42", "QuickCash ATM"];
            return {
                id: Math.floor(Math.random() * 1_000_000_000),
                amount: Math.round(Math.random() * 500000) / 100,
                merchant: merchants[Math.floor(Math.random() * merchants.length)],
                date: new Date().toISOString(),
                description: "idk",
                category_id: 0
            };
        }

        // Queue a dummy transaction for review, then poll for its result by key.
        async function checkDummyTransaction() {
            const transaction = window.dummyTransaction();
            const alert = document.getElementById('alert');
            alert.innerHTML = '<p>Transaction queued for anomaly review…</p>';

            await fetch('/anomalies-backend/check-transaction', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(transaction)
            });

            watchForAnomaly(transaction.id, alert);
        }

        // Long-poll /anomaly-alert for a specific transaction id (key).
        // 200 -> render the alert; 204 -> reviewed with no anomaly (stop).
        async function watchForAnomaly(key, target) {
            const resp = await fetch('/anomalies-backend/anomaly-alert?key=' + key);
            if (resp.status === 200) {
                target.innerHTML = await resp.text();
            } else {
                target.innerHTML = '<p>Transaction reviewed — no anomaly detected.</p>';
            }
        }

        // Dismiss an anomaly toast when its close button is clicked.
        document.addEventListener('click', function (event) {
            if (event.target.classList.contains('toast-close')) {
                const toast = event.target.closest('.toast');
                if (toast) toast.remove();
            }
        });
    </script>
</body>
</html>
