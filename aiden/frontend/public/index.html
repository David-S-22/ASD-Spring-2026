<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anomalies</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" 
            integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-json-enc@2.0.1/json-enc.js"
            crossorigin="anonymous"></script>
    <script src="js/dummy-transaction.js"></script>
</head>
<body>
    <h1>Anomalies</h1>
    <button type="button"
            hx-post="/anomalies/dummy-anomaly"
            hx-target="#anomalies"
            hx-swap="innerHTML">
        Create dummy anomaly
    </button>
    <button type="button"
            hx-post="/anomalies/check-transaction"
            hx-ext="json-enc"
            hx-vals="js:dummyTransaction()"
            hx-target="#alert"
            hx-swap="innerHTML">
        Check dummy transaction
    </button>
    <div id="alert"></div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Transaction</th>
                <th>Reason suspected</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="anomalies" hx-get="/anomalies/anomalies" hx-trigger="load" hx-swap="innerHTML">
            <tr><td colspan="4">Loading…</td></tr>
        </tbody>
    </table>
</body>
</html>
