<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anomalies</title>
</head>
<body>
    <style>
        .modal-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 8vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }
        .modal-overlay[hidden] { display: none; }
        .modal-overlay:not([hidden]) { animation: modal-fade-in 0.16s ease-out; }
        .modal-overlay.closing { animation: modal-fade-out 0.16s ease-in forwards; }
        .modal {
            background: var(--color-surface, #ffffff);
            color: var(--color-text, #1e293b);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--color-border, #cbd5e1);
            max-width: 620px;
            width: 90%;
            max-height: 84vh;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .modal-overlay:not([hidden]) .modal { animation: modal-pop-in 0.18s ease-out; }
        .modal-overlay.closing .modal { animation: modal-pop-out 0.16s ease-in forwards; }
        @keyframes modal-fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modal-fade-out { from { opacity: 1; } to { opacity: 0; } }
        @keyframes modal-pop-in {
            from { opacity: 0; transform: translateY(8px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes modal-pop-out {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(5px) scale(0.985); }
        }
        @media (prefers-reduced-motion: reduce) {
            .modal-overlay:not([hidden]), .modal-overlay.closing,
            .modal-overlay:not([hidden]) .modal, .modal-overlay.closing .modal {
                animation-duration: 0.01ms;
            }
        }
        .modal h2, .modal p, .modal label { color: var(--color-text, #1e293b); }
        .modal label { display: block; margin: 0.75rem 0 0.25rem; }
        .review-details {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
            margin: 1rem 0;
        }
        .review-detail {
            min-width: 0;
            padding: 0.65rem 0.75rem;
            border: 1px solid var(--color-border, #cbd5e1);
            border-radius: 6px;
            background: var(--color-surface-alt, #f8fafc);
        }
        .review-detail dt {
            margin-bottom: 0.3rem;
            color: var(--color-text-muted, #64748b);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .review-detail dd {
            margin: 0;
            color: var(--color-text, #1e293b);
            font-weight: 600;
            overflow-wrap: anywhere;
        }
        .review-detail-reason {
            grid-column: 1 / -1;
            background: var(--color-surface-alt, #f8fafc);
        }
        .review-detail-reason dd { font-weight: 500; line-height: 1.5; }
        @media (max-width: 520px) {
            .review-details { grid-template-columns: 1fr; }
            .review-detail-reason { grid-column: auto; }
        }
        .modal select {
            width: 100%;
            padding: 0.4rem;
            background: var(--color-surface-alt, #ffffff);
            color: var(--color-text, #1e293b);
            border: 1px solid var(--color-border, #cbd5e1);
            border-radius: 5px;
        }
        .modal-actions { margin-top: 1.25rem; display: flex; gap: 0.5rem; justify-content: flex-end; }

        /* Review action buttons (matches the savings module palette). */
        button.btn-accept, button.btn-cancel {
            padding: 5px 16px;
            cursor: pointer;
            border-radius: 5px;
            border: 1px solid transparent;
            font-size: 0.86rem;
            font-weight: 600;
            color: #ffffff !important;
            transition: background-color 0.15s ease;
        }
        button.btn-accept { background-color: #198754 !important; }
        button.btn-accept:hover { background-color: #157347 !important; }
        button.btn-cancel { background-color: #475569 !important; }
        button.btn-cancel:hover { background-color: #334155 !important; }
        button.review-btn {
            padding: 4px 12px;
            cursor: pointer;
            border-radius: 5px;
            border: 1px solid transparent;
            font-size: 0.86rem;
            font-weight: 600;
            color: #ffffff !important;
            background-color: #0284c7 !important;
            transition: background-color 0.15s ease;
        }
        button.review-btn:hover { background-color: #0369a1 !important; }

        /* Status badges (mirrors the savings accepted/rejected styling). */
        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .status-accepted {
            background-color: rgba(74, 222, 128, 0.15);
            color: var(--color-success, #15803d);
            border: 1px solid rgba(74, 222, 128, 0.3);
        }
        .status-rejected {
            background-color: rgba(248, 113, 113, 0.15);
            color: var(--color-danger, #b91c1c);
            border: 1px solid rgba(248, 113, 113, 0.3);
        }
        .status-unreviewed {
            background-color: rgba(148, 163, 184, 0.15);
            color: var(--color-text-muted, #475569);
            border: 1px solid rgba(148, 163, 184, 0.3);
        }
    </style>
    <h1>Anomalies</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Date</th>
                <th>Merchant</th>
                <th>Reason suspected</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="anomalies" hx-get="/anomalies-backend/anomalies" hx-trigger="load, every 5s" hx-swap="innerHTML">
            <tr><td colspan="6" style="text-align: center;">Loading…</td></tr>
        </tbody>
    </table>

    <div id="review-modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="review-modal-title">
        <div class="modal">
            <h2 id="review-modal-title">Review anomaly</h2>
            <p>Your feedback will be used to better predict future anomalies.</p>
            <dl class="review-details">
                <div class="review-detail">
                    <dt>Transaction ID</dt>
                    <dd id="review-transaction-id"></dd>
                </div>
                <div class="review-detail">
                    <dt>Date</dt>
                    <dd id="review-transaction-date"></dd>
                </div>
                <div class="review-detail">
                    <dt>Merchant</dt>
                    <dd id="review-transaction-merchant"></dd>
                </div>
                <div class="review-detail">
                    <dt>Amount</dt>
                    <dd id="review-transaction-amount"></dd>
                </div>
                <div class="review-detail">
                    <dt>Description</dt>
                    <dd id="review-transaction-description"></dd>
                </div>
                <div class="review-detail">
                    <dt>Category ID</dt>
                    <dd id="review-transaction-category"></dd>
                </div>
                <div class="review-detail review-detail-reason">
                    <dt>Reason suspected</dt>
                    <dd id="review-anomaly-reason"></dd>
                </div>
            </dl>
            <label for="review-decision">Decision</label>
            <select id="review-decision">
                <option value="confirm">Accept</option>
                <option value="dismiss">Reject</option>
            </select>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeReviewModal()">Cancel</button>
                <button type="button" class="btn-accept" onclick="submitReview()">Submit</button>
            </div>
        </div>
    </div>

    <script>
        // Anomaly review modal: pick Accept/Reject from a dropdown, then submit.
        let reviewAnomalyId = null;

        function openReviewModal(button) {
            reviewAnomalyId = Number(button.dataset.anomalyId);
            document.getElementById('review-transaction-id').textContent = button.dataset.transactionId;
            document.getElementById('review-transaction-date').textContent = button.dataset.date;
            document.getElementById('review-transaction-merchant').textContent = button.dataset.merchant;
            document.getElementById('review-transaction-amount').textContent = button.dataset.amount;
            document.getElementById('review-transaction-description').textContent = button.dataset.description;
            document.getElementById('review-transaction-category').textContent = button.dataset.categoryId;
            document.getElementById('review-anomaly-reason').textContent = button.dataset.reason;
            document.getElementById('review-decision').value = 'confirm';
            const modal = document.getElementById('review-modal');
            modal.classList.remove('closing');
            modal.hidden = false;
        }

        function closeReviewModal() {
            const modal = document.getElementById('review-modal');
            if (modal.hidden || modal.classList.contains('closing')) return;

            reviewAnomalyId = null;
            modal.classList.add('closing');
        }

        document.getElementById('review-modal').addEventListener('animationend', function (event) {
            if (event.target === this && this.classList.contains('closing')) {
                this.hidden = true;
                this.classList.remove('closing');
            }
        });

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') closeReviewModal();
        });

        // Send the chosen decision to the backend and refresh the table.
        async function submitReview() {
            if (reviewAnomalyId === null) return;

            const decision = document.getElementById('review-decision').value; // 'confirm' | 'dismiss'
            const resp = await fetch('/anomalies-backend/anomalies/' + reviewAnomalyId + '/' + decision, {
                method: 'POST'
            });

            if (resp.ok) {
                document.getElementById('anomalies').innerHTML = await resp.text();
            }

            closeReviewModal();
        }
    </script>
</body>
</html>
