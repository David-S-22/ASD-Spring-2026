<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anomalies</title>
</head>
<body>
            <h1>Anomalies</h1>
    <button type="button"
            hx-post="/anomalies-backend/dummy-anomaly"
            hx-target="#anomalies"
            hx-swap="innerHTML">
        Create dummy anomaly
    </button>
    <button type="button"
            hx-post="/anomalies-backend/check-transaction"
            hx-ext="json-enc"
            hx-vals="js:{...window.dummyTransaction()}"
            hx-target="#alert"
            hx-swap="innerHTML">
        Check dummy transaction
    </button>
    <div id="alert"></div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Transaction</th>
                <th>Reason suspected</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="anomalies" hx-get="/anomalies-backend/anomalies" hx-trigger="load" hx-swap="innerHTML">
            <tr><td colspan="4">Loading…</td></tr>
        </tbody>
    </table>

    <script>
        // Provides a dummy transaction payload for the anomaly checker.
        window.dummyTransaction = function () {
            const merchants = ["Corner Store", "MegaMart", "Unknown LLC", "Cafe 42", "QuickCash ATM"];
            return {
                id: crypto.randomUUID(),
                amount: Math.round(Math.random() * 500000) / 100,
                merchant: merchants[Math.floor(Math.random() * merchants.length)],
                date: new Date().toISOString(),
            };
        }
    </script>
</body>
</html>
