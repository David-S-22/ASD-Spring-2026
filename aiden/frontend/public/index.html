<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anomalies</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" 
            integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
            crossorigin="anonymous"></script>
</head>
<body>
    <h1>Anomalies</h1>
    <button type="button"
            hx-post="/anomalies-backend/dummy-anomaly"
            hx-target="#anomalies"
            hx-swap="innerHTML">
        Create dummy anomaly
    </button>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Transaction</th>
                <th>Reason suspected</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="anomalies" hx-get="/anomalies-backend/anomalies" hx-trigger="load" hx-swap="innerHTML">
            <tr><td colspan="4">Loading…</td></tr>
        </tbody>
    </table>
</body>
</html>
