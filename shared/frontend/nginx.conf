server {
    listen ${PORT};
    server_name _;

    root /app/public;
    index index.html;

    location /anomalies-frontend/ {
        proxy_pass ${ANOMALIES_FRONTEND_URL}/;
        proxy_set_header Host $host;
    }

    location /transactions-frontend/ {
        proxy_pass ${TRANSACTIONS_FRONTEND_URL}/;
        proxy_set_header Host $host;
    }

    location /savings-frontend/ {
        proxy_pass ${SAVINGS_FRONTEND_URL}/;
        proxy_set_header Host $host;
    }

    location /bills-frontend/ {
        proxy_pass ${BILLS_FRONTEND_URL}/;
        proxy_set_header Host $host;
    }

    # The anomalies UI (served from /anomalies-frontend/) makes absolute
    # /anomalies-backend/* htmx calls. Forward them to the anomalies FRONTEND, which
    # proxies on to its own backend. The shared shell never contacts a backend directly.
    location /anomalies-backend/ {
        proxy_pass ${ANOMALIES_FRONTEND_URL};
        proxy_set_header Host $host;
    }
}
