server {
    listen ${PORT};
    server_name _;

    root /app/public;
    index index.html;

    location /anomalies-frontend/ {
        proxy_pass ${ANOMALIES_FRONTEND_URL}/;
        proxy_set_header Host $host;
    }

    location /transactions-frontend/ {
        proxy_pass ${TRANSACTIONS_FRONTEND_URL}/;
        proxy_set_header Host $host;
    }

    location /savings-frontend/ {
        proxy_pass ${SAVINGS_FRONTEND_URL}/;
        proxy_set_header Host $host;
    }

    location /bills-frontend/ {
        proxy_pass ${BILLS_FRONTEND_URL}/;
        proxy_set_header Host $host;
    }
}
